[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-textbook-engine"
version = "0.4.0"
description = "Convert lectures (video/audio/pdf/text) into a multimodal textbook."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "click>=8.0",
]

[project.scripts]
mte     = "cli.mte:main"
chapter = "cli.chapter:main"

[tool.setuptools]
packages = ["cli", "config", "engine_v4", "modules", "modules.visual_sync"]
